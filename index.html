<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CRM Reactivare Domestic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: aplicație de vânzări — bară laterală de navigare închisă la culoare, conținut luminos; „Acasă” arată ce ai de făcut azi;
   fișa clientului se deschide ca un panou mare, cu etapele ca un traseu (stepper) și filele Rezumat / Jurnal / Contacte / Cercetare. */
:root {
  --bg: #F2F5F8; --surface: #FFFFFF; --surface-2: #F7F9FB; --surface-3: #EDF1F5; --ink: #0F1B26; --ink-2: #2A3947; --muted: #5C6C7B; --faint: #8492A0;
  --line: #E1E7ED; --line-2: #CBD5DE;
  --side: #0F2033; --side-ink: #B9C7D6; --side-strong: #FFFFFF; --side-hover: #183049; --side-active: #21456C; --side-line: #22374E;
  --accent: #1F64C7; --accent-hover: #1853A8; --accent-ink: #FFFFFF; --accent-soft: #E7EFFB;
  --amber: #B97410; --amber-soft: #FCF0DA;
  --ok: #18804D; --ok-soft: #DFF3E8; --warn: #946008; --warn-soft: #FAEED5; --watch: #B04A16; --watch-soft: #FCE7DC; --bad: #C0281C; --bad-soft: #FCE4E1; --dead: #637180; --dead-soft: #ECEFF2;
  --s-neatins: #6F7E8D; --s-neatins-soft: #EDF0F3; --s-contactat: #2471C9; --s-contactat-soft: #E4EFFB; --s-discutie: #4A52C9; --s-discutie-soft: #EBECFB;
  --s-oferta: #8541C2; --s-oferta-soft: #F2E8FB; --s-test: #B9720B; --s-test-soft: #FCEFDB; --s-activ: #178452; --s-activ-soft: #DFF3E8;
  --s-amanat: #9C640D; --s-amanat-soft: #F6ECDA; --s-pierdut: #87929D; --s-pierdut-soft: #EEF0F2;
  --t-amb: #7A6642; --t-amb-soft: #F1EADB; --t-ctl: #23704B; --t-ctl-soft: #DFF1E7; --t-ref: #1A64A8; --t-ref-soft: #E0EDF9; --t-cong: #4334A0; --t-cong-soft: #E9E6F9;
  --plate-band: #1F43A3; --plate-bg: #FFFFFF; --plate-ink: #10161C; --plate-line: #9AA6B1;
  --m0: #E5EAEF; --m1: #C9DBEC; --m2: #96BCDF; --m3: #5F98CB; --m4: #2F6FAB; --m5: #0B4F8A;
  --toast-link: #8DBBF2;
  --scrim: rgba(10, 20, 30, .42); --shadow-1: 0 1px 2px rgba(15, 27, 38, .06); --shadow-2: 0 2px 6px rgba(15, 27, 38, .06), 0 12px 32px rgba(15, 27, 38, .10);
  --f-display: 'Archivo', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1218; --surface: #141C25; --surface-2: #18222D; --surface-3: #1E2935; --ink: #E5ECF2; --ink-2: #C8D3DD; --muted: #9AA9B7; --faint: #75838F;
    --line: #243140; --line-2: #314152;
    --side: #08111A; --side-ink: #9FB0C1; --side-strong: #FFFFFF; --side-hover: #12202E; --side-active: #1B3550; --side-line: #172433;
    --accent: #6EA8EE; --accent-hover: #8DBBF2; --accent-ink: #0A1A2B; --accent-soft: #172E48;
    --amber: #EDB24C; --amber-soft: #3A2B10;
    --ok: #67C996; --ok-soft: #15301F; --warn: #E6B661; --warn-soft: #35280E; --watch: #F2925F; --watch-soft: #3A1F13; --bad: #F48A80; --bad-soft: #3D1714; --dead: #9AA7B3; --dead-soft: #222D38;
    --s-neatins: #9AA7B4; --s-neatins-soft: #212C37; --s-contactat: #6EA8EE; --s-contactat-soft: #172E48; --s-discutie: #9CA1F2; --s-discutie-soft: #22244A;
    --s-oferta: #C59AF0; --s-oferta-soft: #2E1F44; --s-test: #EDB24C; --s-test-soft: #3A2B10; --s-activ: #67C996; --s-activ-soft: #15301F;
    --s-amanat: #D9A85A; --s-amanat-soft: #33270F; --s-pierdut: #8C98A4; --s-pierdut-soft: #222B34;
    --t-amb: #CDB98F; --t-amb-soft: #2E2818; --t-ctl: #67C996; --t-ctl-soft: #15301F; --t-ref: #7AB6EE; --t-ref-soft: #16304A; --t-cong: #ABA2F2; --t-cong-soft: #252047;
    --plate-band: #3D63C9; --plate-bg: #EEF2F5; --plate-ink: #10161C; --plate-line: #5D6B78;
    --m0: #1B2631; --m1: #1C3550; --m2: #234E78; --m3: #2D69A3; --m4: #4A8ACB; --m5: #86BBEE;
    --toast-link: #1F64C7;
    --scrim: rgba(0, 0, 0, .58); --shadow-1: 0 1px 2px rgba(0, 0, 0, .35); --shadow-2: 0 2px 8px rgba(0, 0, 0, .35), 0 14px 36px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1218; --surface: #141C25; --surface-2: #18222D; --surface-3: #1E2935; --ink: #E5ECF2; --ink-2: #C8D3DD; --muted: #9AA9B7; --faint: #75838F;
  --line: #243140; --line-2: #314152;
  --side: #08111A; --side-ink: #9FB0C1; --side-strong: #FFFFFF; --side-hover: #12202E; --side-active: #1B3550; --side-line: #172433;
  --accent: #6EA8EE; --accent-hover: #8DBBF2; --accent-ink: #0A1A2B; --accent-soft: #172E48;
  --amber: #EDB24C; --amber-soft: #3A2B10;
  --ok: #67C996; --ok-soft: #15301F; --warn: #E6B661; --warn-soft: #35280E; --watch: #F2925F; --watch-soft: #3A1F13; --bad: #F48A80; --bad-soft: #3D1714; --dead: #9AA7B3; --dead-soft: #222D38;
  --s-neatins: #9AA7B4; --s-neatins-soft: #212C37; --s-contactat: #6EA8EE; --s-contactat-soft: #172E48; --s-discutie: #9CA1F2; --s-discutie-soft: #22244A;
  --s-oferta: #C59AF0; --s-oferta-soft: #2E1F44; --s-test: #EDB24C; --s-test-soft: #3A2B10; --s-activ: #67C996; --s-activ-soft: #15301F;
  --s-amanat: #D9A85A; --s-amanat-soft: #33270F; --s-pierdut: #8C98A4; --s-pierdut-soft: #222B34;
  --t-amb: #CDB98F; --t-amb-soft: #2E2818; --t-ctl: #67C996; --t-ctl-soft: #15301F; --t-ref: #7AB6EE; --t-ref-soft: #16304A; --t-cong: #ABA2F2; --t-cong-soft: #252047;
  --plate-band: #3D63C9; --plate-bg: #EEF2F5; --plate-ink: #10161C; --plate-line: #5D6B78;
  --m0: #1B2631; --m1: #1C3550; --m2: #234E78; --m3: #2D69A3; --m4: #4A8ACB; --m5: #86BBEE;
  --toast-link: #1F64C7;
  --scrim: rgba(0, 0, 0, .58); --shadow-1: 0 1px 2px rgba(0, 0, 0, .35); --shadow-2: 0 2px 8px rgba(0, 0, 0, .35), 0 14px 36px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent) !important; outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .86em; }
.lbl { font-family: var(--f-display); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* cadru */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 18px 12px; gap: 18px; }
.logo { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
.logo .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.logo b { display: block; color: var(--side-strong); font-family: var(--f-display); font-weight: 800; font-stretch: 88%; font-size: 16px; line-height: 1.1; }
.logo span { font-size: 12px; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; border: 0; background: none; color: var(--side-ink); padding: 9px 10px; border-radius: 8px; text-align: left; font-size: 15px; font-weight: 600; }
.nav button:hover { background: var(--side-hover); color: var(--side-strong); }
.nav button[aria-current="page"] { background: var(--side-active); color: var(--side-strong); }
.nav button .badge { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--side-line); color: var(--side-ink); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.nav button .badge.alert { background: var(--bad); color: #FFFFFF; }
.side .foot { margin-top: auto; font-size: 12px; line-height: 1.5; padding: 10px; border-top: 1px solid var(--side-line); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; padding: 12px 28px; max-width: 1440px; margin: 0 auto; width: 100%; }
.search { position: relative; flex: 1 1 auto; max-width: 620px; }
.search .box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 0 12px; box-shadow: var(--shadow-1); }
.search .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; border: 0; background: transparent; padding: 10px 0; outline: none; min-width: 0; }
.search kbd { font-family: var(--f-mono); font-size: 11px; color: var(--faint); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-2); padding: 6px; z-index: 40; max-height: 70vh; overflow-y: auto; }
.sugg button { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; }
.sugg button:hover, .sugg button.hl { background: var(--surface-3); }
.sugg .t { flex: 1; min-width: 0; }
.sugg .t b { display: block; font-weight: 600; }
.sugg .t small { color: var(--muted); font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sugg .all { color: var(--accent); font-weight: 600; justify-content: center; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; margin-top: 4px; }
.me { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.me:hover { border-color: var(--accent); }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.sync.on i { background: var(--ok); } .sync.ro i { background: var(--warn); }
.sandbox { background: var(--amber-soft); color: var(--ink); border-bottom: 1px solid var(--line); font-size: 13.5px; padding: 7px 28px; }
.page { padding: 24px 28px 64px; max-width: 1440px; margin: 0 auto; width: 100%; display: grid; gap: 20px; align-content: start; }
.phead { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
.phead h1 { font-size: 28px; font-weight: 800; font-stretch: 90%; display: flex; align-items: center; gap: 6px; }
.phead p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.bnav { display: none; }

/* butoane și controale */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px 13px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; }
.link:hover { text-decoration: underline; text-underline-offset: 2px; }
.inp { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 8px 11px; min-width: 0; width: 100%; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.inp { resize: vertical; min-height: 76px; }
.field { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
.err { color: var(--bad); font-size: 13px; }

/* carduri */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow-1); min-width: 0; }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card > header h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card > header h3 svg { color: var(--muted); }
.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { padding: 16px 18px; }
.stat .v { font-family: var(--f-display); font-weight: 800; font-stretch: 90%; font-size: 30px; line-height: 1.1; margin-top: 4px; }
.stat .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
.stat.alert .v { color: var(--bad); }
.stat button { all: unset; cursor: pointer; display: block; }
.empty { text-align: center; color: var(--muted); padding: 26px 12px; }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 16px; margin-bottom: 4px; }

/* elemente de date */
.av { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 12px; color: #FFFFFF; flex: none; }
.av.none { background: transparent; border: 1.5px dashed var(--line-2); color: var(--faint); }
.who { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px 3px 8px; white-space: nowrap; }
.stage::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-neatins { color: var(--s-neatins); background: var(--s-neatins-soft); } .s-contactat { color: var(--s-contactat); background: var(--s-contactat-soft); }
.s-discutie { color: var(--s-discutie); background: var(--s-discutie-soft); } .s-oferta { color: var(--s-oferta); background: var(--s-oferta-soft); }
.s-test { color: var(--s-test); background: var(--s-test-soft); } .s-activ { color: var(--s-activ); background: var(--s-activ-soft); }
.s-amanat { color: var(--s-amanat); background: var(--s-amanat-soft); } .s-pierdut { color: var(--s-pierdut); background: var(--s-pierdut-soft); }
.risk { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; white-space: nowrap; }
.risk::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.r-ok { color: var(--ok); } .r-warn { color: var(--warn); } .r-watch { color: var(--watch); } .r-bad { color: var(--bad); } .r-dead { color: var(--dead); }
.flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.f-red { color: var(--bad); background: var(--bad-soft); } .f-hu { color: var(--accent); background: var(--accent-soft); } .f-olt { color: var(--amber); background: var(--amber-soft); }
.f-gray { color: var(--dead); background: var(--dead-soft); }
.plates { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; vertical-align: middle; }
.plate { display: inline-flex; align-items: stretch; border: 1px solid var(--plate-line); border-radius: 3px; overflow: hidden; background: var(--plate-bg); color: var(--plate-ink); font-family: var(--f-display); font-stretch: 80%; font-weight: 700; font-size: 11.5px; line-height: 1; }
.plate i { background: var(--plate-band); color: #FFFFFF; font-style: normal; font-size: 6.5px; padding: 4px 2px 0; }
.plate b { padding: 3px 4px; }
.plate.olt { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.tchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; border-radius: 6px; padding: 2px 8px; margin: 1px 4px 1px 0; white-space: nowrap; }
.t-amb { background: var(--t-amb-soft); color: var(--t-amb); } .t-ctl { background: var(--t-ctl-soft); color: var(--t-ctl); }
.t-ref { background: var(--t-ref-soft); color: var(--t-ref); } .t-cong { background: var(--t-cong-soft); color: var(--t-cong); }
.t-unk, .t-none { background: var(--dead-soft); color: var(--dead); }
.date { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; border-radius: 6px; padding: 1px 7px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.date.late { background: var(--bad-soft); color: var(--bad); } .date.today { background: var(--amber-soft); color: var(--amber); }
.src { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .03em; border-radius: 5px; padding: 1px 6px; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.src.ioan { background: var(--amber-soft); color: var(--amber); }
.src.val2 { background: var(--accent-soft); color: var(--accent); }

/* segmente, filtre */
.segs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.seg { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
.seg small { font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
.seg:hover { border-color: var(--accent); }
.seg[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg[aria-pressed="true"] small { color: inherit; opacity: .75; }
.fbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 6px 10px 6px 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.fbtn:hover, .fbtn[aria-expanded="true"] { border-color: var(--accent); }
.fbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.fbtn .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11.5px; padding: 0 6px; }
.fbtn svg.i { width: 15px; height: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 7px; padding: 3px 6px 3px 9px; font-size: 13px; font-weight: 600; }
.chip svg.i { width: 13px; height: 13px; }
.pop { position: absolute; z-index: 50; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-2); width: 300px; max-width: calc(100vw - 24px); padding: 8px; }
.pop .ph { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 8px; }
.pop .opts { max-height: 340px; overflow-y: auto; display: grid; gap: 1px; }
.pop label { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px; font-size: 14px; cursor: pointer; }
.pop label:hover { background: var(--surface-3); }
.pop label.dis { opacity: .45; }
.pop label small { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
.pop input[type=checkbox], .rowsel { width: 16px; height: 16px; accent-color: var(--accent); }
.pop .pf { display: flex; justify-content: space-between; padding: 8px 6px 2px; border-top: 1px solid var(--line); margin-top: 6px; }
.pop .menu { display: grid; gap: 2px; }
.pop .menu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 8px; border-radius: 8px; font-size: 14px; }
.pop .menu button:hover, .pop .menu button[aria-checked="true"] { background: var(--surface-3); }

/* file de liste + bară de instrumente (în cardul tabelului) */
.lt { display: flex; align-items: stretch; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
.lt::-webkit-scrollbar { display: none; }
.lt button { border: 0; background: none; padding: 14px 10px 12px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.lt button:hover { color: var(--ink); }
.lt button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.lt .c { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-3); border-radius: 999px; padding: 0 7px; line-height: 19px; font-variant-numeric: tabular-nums; }
.lt button[aria-selected="true"] .c { background: var(--accent-soft); color: var(--accent); }
.lt .lt-more { margin-left: auto; padding-right: 4px; }
.lt .lt-more svg.i { width: 15px; height: 15px; }
.tb { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 56px; }
.tb .sp { flex: 1; }
.tb-btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tb-btn:hover { border-color: var(--accent); color: var(--accent); }
.tb-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tb-btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.tb-btn.ghost:hover { color: var(--ink); background: var(--surface-3); }
.tb-btn svg.i { width: 16px; height: 16px; }
.tb-btn .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11.5px; padding: 0 6px; line-height: 18px; }
.tb-hint { font-size: 13.5px; color: var(--faint); }
.tb.bulkmode { background: var(--accent-soft); font-size: 14px; }
.tb.bulkmode select { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; background: var(--surface); color: var(--ink); }
.tb.bulkmode label { display: inline-flex; gap: 8px; align-items: center; color: var(--ink-2); font-weight: 600; }
.card.flush { padding: 0; overflow: hidden; }
.card.flush .tb { border-bottom: 0; }
.hcount { font-family: var(--f-body); font-size: 15px; font-weight: 700; color: var(--muted); background: var(--surface-3); border-radius: 999px; padding: 2px 10px; vertical-align: 5px; margin-left: 4px; }
.pop.wide { width: 640px; padding: 0; }
.fp { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 340px; }
.fp-cats { border-right: 1px solid var(--line); padding: 8px; display: grid; align-content: start; gap: 1px; background: var(--surface-2); border-radius: 12px 0 0 0; }
.fp-cats button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.fp-cats button:hover { background: var(--surface-3); }
.fp-cats button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-1); }
.fp-cats .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11.5px; padding: 0 6px; line-height: 18px; }
.fp-opts { padding: 8px; max-height: 400px; overflow-y: auto; }
.fp-opts h4 { font-size: 13px; color: var(--muted); font-weight: 600; padding: 6px 8px 8px; }
.pop.wide .pf { padding: 10px 14px; margin: 0; align-items: center; }

/* listă */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-1); }
.lrow { display: grid; grid-template-columns: 36px minmax(240px, 2.3fr) 150px 132px 128px 112px minmax(190px, 1.7fr); gap: 14px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); cursor: pointer; }
.lrow:first-child { border-top: 0; }
.lrow:hover { background: var(--surface-2); }
.lrow.sel { background: var(--accent-soft); }
.lrow.head { cursor: default; background: var(--surface-2); padding-block: 9px; position: sticky; top: 0; }
.lrow.head button { all: unset; cursor: pointer; font-family: var(--f-display); font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.lrow.head button:hover { color: var(--ink); }
.lrow > div { min-width: 0; }
.cname b { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.cname small { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-top: 3px; }
.vol b { font-family: var(--f-display); font-size: 16px; font-weight: 700; }
.vol small { color: var(--faint); font-size: 12px; margin-left: 3px; }
.vbar { height: 4px; border-radius: 2px; background: var(--surface-3); margin-top: 5px; overflow: hidden; }
.vbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.nxt { font-size: 13.5px; color: var(--ink-2); display: grid; gap: 4px; }
.nxt span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bulk { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; position: sticky; top: 70px; z-index: 20; box-shadow: var(--shadow-2); }
.bulk select { border-radius: 8px; border: 0; padding: 6px 8px; background: var(--surface); color: var(--ink); }
.bulk .btn { border-color: transparent; }
.more-row { text-align: center; padding: 12px; border-top: 1px solid var(--line); }

/* acasă */
.hello h1 { font-size: 30px; font-weight: 800; font-stretch: 90%; }
.agenda { display: grid; gap: 2px; }
.ag { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 10px; border: 0; background: none; text-align: left; width: 100%; }
.ag:hover { background: var(--surface-2); }
.ag b { display: block; font-weight: 700; }
.ag small { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sugi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 8px; border-radius: 10px; }
.sugi:hover { background: var(--surface-2); }
.sugi b { font-weight: 700; display: block; }
.sugi small { color: var(--muted); font-size: 13px; }
.mini-pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.mini-pipe button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px; text-align: left; }
.mini-pipe button:hover { border-color: var(--accent); }
.mini-pipe b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.feed p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.feed .h { font-size: 13px; color: var(--muted); }
.feed .h b { color: var(--ink); }
.chooser { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.chooser button { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 10px 16px 10px 10px; font-weight: 700; font-size: 15px; }
.chooser button:hover { border-color: var(--accent); }

/* profil */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(1040px, 100%); background: var(--bg); z-index: 61; box-shadow: var(--shadow-2); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: din .2s ease-out; } @keyframes din { from { transform: translateX(28px); opacity: .5; } } }
.ph-top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 28px 0; position: sticky; top: 0; z-index: 3; }
.ph-bar { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.ph-name { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ph-name h2 { font-size: 26px; font-weight: 800; font-stretch: 88%; line-height: 1.1; }
.ph-sub { color: var(--muted); margin-top: 4px; font-size: 14.5px; }
.ph-ctrl { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-top: 14px; }
.stepper { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.step { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.step .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; }
.step .dot svg { width: 11px; height: 11px; stroke-width: 3; }
.step.done { color: var(--ink-2); }
.step.done .dot { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }
.step.cur { border-color: currentColor; }
.step.cur .dot { border-color: currentColor; background: currentColor; }
.step:not(:disabled):hover { border-color: var(--accent); }
.step:disabled { cursor: default; }
.stepsep { width: 10px; height: 2px; background: var(--line-2); }
.side-acts { display: inline-flex; gap: 6px; margin-left: 6px; }
.tabs { display: flex; gap: 2px; margin-top: 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px 12px; font-weight: 700; font-size: 14.5px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button small { background: var(--surface-3); color: var(--muted); border-radius: 999px; padding: 0 7px; font-size: 12px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.ph-body { padding: 22px 28px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.ph-main, .ph-aside { display: grid; gap: 16px; min-width: 0; }
.kv { display: grid; gap: 12px; }
.kv > div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; font-size: 14px; align-items: baseline; }
.kv > div > span:first-child { color: var(--muted); font-size: 13px; }
.kv .big { font-family: var(--f-display); font-size: 18px; font-weight: 800; }
.note-ops { font-size: 14.5px; background: var(--amber-soft); border-radius: 10px; padding: 12px 14px; color: var(--ink); }
.note-ops::before { content: "„"; } .note-ops::after { content: "”"; }
.nextform { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 10px; }
.nextform .acts { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.composer { display: grid; gap: 10px; margin-bottom: 18px; }
.tiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.tip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.timeline li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.timeline li.empty-li { display: block; color: var(--faint); font-size: 14px; }
.timeline .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-3); color: var(--muted); display: grid; place-items: center; }
.timeline li.corectie .ic { background: var(--amber-soft); color: var(--amber); }
.timeline .h { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.timeline .h b { color: var(--ink); }
.timeline p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.contact { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.contact:first-child { border-top: 0; }
.contact .ci { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; color: var(--muted); }
.contact .cv { flex: 1; min-width: 160px; }
.contact .cv b { display: block; font-weight: 700; }
.contact .cv span { font-size: 13px; color: var(--muted); }
.cform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line-2); }
.cform .acts { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
.fisa { font-size: 15px; line-height: 1.6; }
.fisa details { border-top: 1px solid var(--line); padding: 4px 0; }
.fisa details:first-of-type { border-top: 0; }
.fisa summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.fisa summary::-webkit-details-marker { display: none; }
.fisa summary::after { content: "+"; color: var(--muted); font-size: 18px; }
.fisa details[open] summary::after { content: "–"; }
.fisa .body { padding: 0 0 14px; }
.fisa .model { display: block; margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; font-size: 13.5px; color: var(--muted); }
.fisa .chip { display: inline-block; font-size: 12px; border-radius: 5px; padding: 0 6px; }
.fisa .chip.c-amb { background: var(--t-amb-soft); color: var(--t-amb); } .fisa .chip.c-frigo { background: var(--t-ref-soft); color: var(--t-ref); }
.fisa .sub { display: inline; }
.recom { font-size: 14.5px; line-height: 1.55; }
.motiv { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; width: 100%; }

/* pipeline */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 10px; }
.col { background: var(--surface-3); border-radius: 14px; display: flex; flex-direction: column; min-height: 240px; max-height: 74vh; border-top: 4px solid var(--c); }
.col.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.col > header { padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.col > header b { font-family: var(--f-display); font-size: 15px; }
.col > header small { color: var(--muted); font-size: 12.5px; }
.col .cards { padding: 4px 10px 12px; display: grid; gap: 8px; overflow-y: auto; align-content: start; }
.kc { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; cursor: pointer; box-shadow: var(--shadow-1); display: grid; gap: 6px; }
.kc[draggable="true"] { cursor: grab; }
.kc:hover { border-color: var(--accent); }
.kc b { font-weight: 700; font-size: 14.5px; }
.kc .r { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }

/* hartă și analize */
.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.mapbox { overflow-x: auto; }
.mapbox svg { width: 100%; min-width: 520px; height: auto; display: block; }
.mapbox path { stroke: var(--surface); stroke-width: 1; cursor: pointer; }
.mapbox path:hover { stroke: var(--ink); stroke-width: 1.5; }
.mapbox path.on { stroke: var(--ink); stroke-width: 2.6; }
.mapbox path.olt-edge { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 5 3; pointer-events: none; }
.mapbox text { font-family: var(--f-display); font-size: 11px; font-weight: 700; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }
.toggle { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; }
.toggle button { border: 0; background: none; border-radius: 8px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.toggle button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rank li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; }
.rank li:hover { background: var(--surface-2); }
.rank button { all: unset; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: minmax(120px, 36%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; border: 0; background: none; padding: 2px 0; text-align: left; width: 100%; }
.bar .tr { height: 12px; background: var(--surface-3); border-radius: 6px; position: relative; overflow: hidden; }
.bar .tr i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--m2); border-radius: 6px; }
.bar .tr i.mn { background: var(--accent); }
.bar .v { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar:hover .l { color: var(--accent); }
.matrix { border-collapse: separate; border-spacing: 4px; width: 100%; font-size: 13px; }
.matrix th { font-family: var(--f-display); font-weight: 600; font-size: 12px; color: var(--muted); padding: 4px; }
.matrix td { text-align: center; }
.matrix td button { border: 0; width: 100%; padding: 10px 0; border-radius: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.matrix td span { display: block; padding: 10px 0; border-radius: 8px; background: var(--surface-2); color: var(--faint); }
.tblwrap { overflow-x: auto; }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.team-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 90px) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.team-row:first-child { border-top: 0; }
.team-row.h { font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 12px 10px 16px; border-radius: 12px; font-size: 14px; z-index: 80; max-width: calc(100% - 32px); box-shadow: var(--shadow-2); display: flex; gap: 14px; align-items: center; }
.toast button { border: 0; background: none; color: var(--toast-link); font-weight: 700; }

@media (max-width: 1280px) {
  .lrow { grid-template-columns: 36px minmax(220px, 2fr) 140px 128px 110px minmax(160px, 1.4fr); }
  .lrow .c-risk { display: none; }
}
@media (max-width: 1100px) {
  .ph-body { grid-template-columns: minmax(0, 1fr); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mapwrap { grid-template-columns: minmax(0, 1fr); }
  .lrow { grid-template-columns: 36px minmax(200px, 2fr) 128px 110px minmax(150px, 1.3fr); }
  .lrow .c-resp { display: none; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .bnav { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--side); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bnav button { border: 0; background: none; color: var(--side-ink); display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; padding: 4px 0; border-radius: 8px; }

const queues = new Map();
function queued(key, fn) { const prev = queues.get(key) || Promise.resolve(); const next = prev.then(fn, fn); queues.set(key, next.catch(() => {})); return next; }
let wroteOnce = false;
async function write(fn) {

    if (code === 'invalid_argument') { toast('Nu ai drept pentru această modificare.'); return false; }
    if (code === 'revoked') { toast('Sesiunea a expirat. Intră din nou în cont.'); return false; }

let sb = null, ME = null;
function errCode(e) {
  const c = String((e && e.code) || ''), m = String((e && e.message) || '');
  if (c === '42501' || /row-level security|permission denied/i.test(m)) return 'invalid_argument';
  if (c === 'PGRST301' || /JWT|jwt expired/i.test(m)) return 'revoked';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'unavailable';
  return c || 'eroare';
}
function chk(res) {
  if (res && res.error) { const err = new Error(res.error.message || 'eroare'); err.code = errCode(res.error); err.detail = res.error.message; throw err; }
  return res ? res.data : null;
}
async function fetchAll(table, cols, order) {
  const out = [];
  for (let i = 0; ; i += 1000) {
    let q = sb.from(table).select(cols || '*');
    if (order) q = q.order(order, { ascending: true });
    const d = chk(await q.range(i, i + 999)) || [];
    out.push(...d);
    if (d.length < 1000) break;
  }
  return out;
}

const DBX = {
  doc(path) {

      async set(body) {
        if (col === 'progres') {
          chk(await sb.from('progres').upsert({ client_id: id, etapa: body.etapa || 'neatins', resp: body.resp || null, pas: body.pas || null,
            termen: body.termen || null, motiv: body.motiv || null, upd: body.upd || new Date().toISOString(), by: ME.id }));

        if (col === 'config' && id === 'echipa') {
          const membri = body.membri || [], del = (D.echipa || []).map(x => x.k).filter(k => !membri.some(m => m.k === k));
          if (membri.length) chk(await sb.from('echipa').upsert(membri.map((m, i) => ({ k: m.k, n: m.n, ordine: i }))));
          if (del.length) chk(await sb.from('echipa').delete().in('k', del));
          reload('echipa'); return;
        }
        throw unknownOp();
      },
      async delete() {
        if (col === 'observatii' || col === 'contacte') { chk(await sb.from(col).delete().eq('id', id)); reload(col); return; }
        throw unknownOp();
      },
    };
  },
  collection(col) {
    return {
      async add(obj) {

};

/* ---------- Pipeline ---------- */

      <div class="cards">${items.slice(0, lim).map(r => { const p = P(r), rk = respOf(r); return `<article class="kc" data-open="${esc(r.id)}" ${D.canWrite ? `draggable="true" data-drag="${esc(r.id)}"` : ''}>

/* ---------- Hartă ---------- */
function viewHarta() {
  const base = filtered('judet');
  const val = {}; let hu = 0;
  for (const r of base) { if (r.hu) hu++; for (const j of r.judete) val[j] = (val[j] || 0) + (S.hm === 'n' ? 1 : (r.vol_min || 0)); }
  const vals = Object.values(val).filter(v => v > 0).sort((x, y) => x - y);
  const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0;
  const br = [q(.2), q(.4), q(.6), q(.8)];
  const step = v => !v ? 0 : v <= br[0] ? 1 : v <= br[1] ? 2 : v <= br[2] ? 3 : v <= br[3] ? 4 : 5;
  const paths = Object.entries(MAP.judete).map(([j, m]) => `<path d="${m.d}" data-jud="${j}" class="${S.f.judet.has(j) ? 'on' : ''}" style="fill:var(--m${step(val[j] || 0)})"><title>${esc(m.nume)} (${j}): ${S.hm === 'n' ? (val[j] || 0) + ' clienți' : fmtInt(val[j] || 0) + ' curse/an'}</title></path>`).join('');
  const olt = [...OLT].map(j => MAP.judete[j] ? `<path class="olt-edge" d="${MAP.judete[j].d}"></path>` : '').join('');
  const labels = Object.entries(MAP.judete).map(([j, m]) => `<text x="${m.c[0]}" y="${m.c[1] + 4}" text-anchor="middle">${j}</text>`).join('');
  const top = Object.entries(val).sort((x, y) => y[1] - x[1]).slice(0, 10);
  const lg = [0, 1, 2, 3, 4, 5].map(i => { const lo = i === 0 ? 0 : i === 1 ? (vals[0] || 1) : br[i - 2] + 1, hi = i === 0 ? 0 : i === 5 ? (vals[vals.length - 1] || 0) : br[i - 1]; if (i > 0 && lo > hi) return ''; return `<span><i style="background:var(--m${i})"></i>${i === 0 ? '0' : lo === hi ? fmtInt(lo) : fmtInt(lo) + '–' + fmtInt(hi)}</span>`; }).join('');
  const selN = S.f.judet.size ? filtered().length : 0;
  return `<div class="phead"><div><h1>Hartă</h1><p>De unde încarcă clienții din selecția curentă · ${base.length} clienți</p></div>
      <div class="toggle" role="group" aria-label="Măsura"><button data-hm="n" aria-pressed="${S.hm === 'n'}">Număr de clienți</button><button data-hm="v" aria-pressed="${S.hm === 'v'}">Volum (curse/an)</button></div></div>
    ${toolCard()}
    <div class="mapwrap"><div class="card mapbox"><svg viewBox="${MAP.viewBox.join(' ')}" role="img" aria-label="Harta României pe județe">${paths}${olt}${labels}</svg>
        <div class="legend"><b class="lbl">${S.hm === 'n' ? 'Clienți' : 'Curse/an'}</b>${lg}<span><i style="border:2px dashed var(--amber)"></i>Oltenia</span></div>
        <p class="note">Apasă un județ ca să-l adaugi la filtru. Un client cu mai multe puncte de încărcare apare în fiecare județ. Contururi © contribuitorii OpenStreetMap.</p></div>
      <div class="grid" style="gap:16px">
        ${S.f.judet.size ? `<div class="card"><header><h3>${ico('pin')}Județe selectate</h3><button class="link" data-act="clearjud">Golește</button></header><div class="plates" style="margin-bottom:12px">${[...S.f.judet].map(plate).join('')}</div><button class="btn pri" data-go="clienti">${ico('users')}Vezi cei ${selN} clienți</button></div>` : ''}
        <div class="card"><header><h3>${ico('chart')}Top județe</h3></header><ol class="rank">${top.map(([j, v]) => `<li><button data-jud="${j}">${plate(j)} ${esc(JUD[j])}</button><span class="num muted">${S.hm === 'n' ? v : fmtInt(v)}</span></li>`).join('') || '<li class="faint">Niciun județ în selecție.</li>'}</ol></div>
        <div class="card"><header><h3>Flux declarat cu Ungaria</h3></header><p style="margin:0 0 10px" class="muted">${hu} clienți cu export, import sau curse declarate în Ungaria, adresabili pe RO–HU / HU–RO.</p><button class="btn sm" data-go="clienti" data-seg="hu">Vezi lista</button></div>
      </div></div>`;
}

/* ---------- Analize ---------- */
function barsHTML(rows, facet) {
  const mx = Math.max(1, ...rows.map(x => x.b || x.n));
  return `<div class="bars">${rows.map(x => `<button class="bar" ${facet ? `data-barf="${facet}" data-v="${esc(x.k)}"` : ''}><span class="l">${esc(x.l)}</span><span class="tr"><i style="width:${(100 * (x.b || x.n) / mx).toFixed(1)}%"></i>${x.a != null ? `<i class="mn" style="width:${(100 * x.a / mx).toFixed(1)}%"></i>` : ''}</span><span class="v">${x.a != null ? `${fmtInt(x.a)}–${fmtInt(x.b)} · ` : ''}${x.n} cl.</span></button>`).join('')}</div>`;
}
function groupBy(list, keyFn, labels) {
  const g = {};
  for (const r of list) for (const k of keyFn(r)) { const o = g[k] = g[k] || { k, l: (labels && labels[k]) || k, n: 0, a: 0, b: 0 }; o.n++; o.a += r.vol_min || 0; o.b += r.vol_max || 0; }
  return Object.values(g).sort((x, y) => y.b - x.b || y.n - x.n);
}
function viewAnalize() {
  const t = filtered().filter(r => r.status === 'tinta');
  const [a, b] = sumVol(t);
  const inl = t.filter(r => IN_LUCRU.has(etapaOf(r))), act = t.filter(r => etapaOf(r) === 'activ'), late = t.filter(isLate);
  const regL = Object.fromEntries(Object.keys(REG).map(k => [k, k])); regL._hu = 'Ungaria (flux declarat)';
  const tm = Object.fromEntries(team().map(m => [m.k, m.n])); tm._none = 'Nealocat';
  const riscRows = ['minim', 'scăzut', 'mediu', 'watchlist', 'ridicat'], volCols = VOL_B.filter(x => x.k !== '0');
  const cell = (rk, vk) => t.filter(r => r.risc === rk && r._vb === vk).length;
  const mxCell = Math.max(1, ...riscRows.flatMap(rk => volCols.map(v => cell(rk, v.k))));
  const matrix = `<div class="tblwrap"><table class="matrix"><thead><tr><th></th>${volCols.map(v => `<th>${v.n.replace(' curse/an', '')}</th>`).join('')}</tr></thead><tbody>${riscRows.map(rk => `<tr><th style="text-align:right">${RISC_N[rk]}</th>${volCols.map(v => { const n = cell(rk, v.k); const s = n ? Math.min(5, 1 + Math.floor(4 * n / mxCell)) : 0; return `<td>${n ? `<button data-matrix="${rk}|${v.k}" style="background:var(--m${s});color:${s >= 4 ? 'var(--accent-ink)' : 'var(--ink)'}">${n}</button>` : '<span>·</span>'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="note">Rânduri: risc. Coloane: curse pe an (estimare minimă). Dreapta-sus = volum mare, risc mic — prioritatea de apel.</p>`;
  const since = Date.now() - 30 * 864e5, ids = new Set(t.map(r => r.id));
  const recent = D.obs.filter(o => ids.has(o.cid) && new Date(o.data).getTime() >= since);
  const byAut = {}; for (const o of recent) byAut[o.autor || '_'] = (byAut[o.autor || '_'] || 0) + 1;
  const stale = t.filter(r => IN_LUCRU.has(etapaOf(r)) && (daysAgo(D.last[r.id]) ?? 999) > 30);
  const kp = (v, l, c) => `<div class="card stat ${c || ''}"><span class="lbl">${l}</span><div class="v num">${v}</div></div>`;
  return `<div class="phead"><div><h1>Analize</h1><p>Toate graficele urmează lista și filtrele de mai jos · ${t.length} ținte</p></div></div>
    ${toolCard()}
    <section class="grid g4">${kp(`${fmtInt(a)}–${fmtInt(b)}`, 'Curse/an estimate')}${kp(t.filter(r => respOf(r)).length + ' / ' + t.length, 'Alocați')}${kp(inl.length, 'În lucru')}${kp(act.length, 'Reactivați')}</section>
    <section class="grid g2">
      <div class="card"><header><h3>Prioritizare: volum × risc</h3></header>${matrix}</div>
      <div class="card"><header><h3>Pâlnia de reactivare</h3></header>${barsHTML(ETAPE.map(e => ({ k: e.k, l: e.n, n: t.filter(r => etapaOf(r) === e.k).length })), 'etapa')}${late.length ? `<p class="note" style="color:var(--bad)">${late.length} termene depășite.</p>` : ''}</div>
      <div class="card"><header><h3>Volum pe regiune de încărcare</h3></header>${barsHTML(groupBy(t, r => [...r.regiuni, ...(r.hu ? ['_hu'] : [])], regL), 'regiune')}<p class="note">Bara închisă = estimarea minimă; bara deschisă = cea maximă.</p></div>
      <div class="card"><header><h3>Volum pe regim de temperatură</h3></header>${barsHTML(groupBy(t, r => r.temp || []), 'temp')}</div>
      <div class="card"><header><h3>Volum pe tip de marfă</h3></header>${barsHTML(groupBy(t, r => [r.sector]), 'sector')}</div>
      <div class="card"><header><h3>Pe responsabil</h3></header>${barsHTML(groupBy(t, r => [respOf(r) || '_none'], tm), 'resp')}</div>
      <div class="card"><header><h3>Activitate în ultimele 30 de zile</h3></header>${D.db ? (recent.length ? `<ol class="rank">${Object.entries(byAut).sort((x, y) => y[1] - x[1]).map(([id, n]) => `<li><span class="who">${avatar(id, who(id))}<span>${esc(id === '_' ? 'Cineva' : who(id))}</span></span><span class="num muted">${n} note</span></li>`).join('')}</ol>` : '<div class="empty"><b>Nicio notă în ultimele 30 de zile</b>pentru selecția curentă.</div>') : '<div class="empty"><b>Apare pe claude.ai</b>În previzualizarea locală nu există bază de date.</div>'}</div>
      <div class="card"><header><h3>Blocați de peste 30 de zile</h3></header>${stale.length ? `<ol class="rank">${stale.slice(0, 12).map(r => `<li><button data-open="${esc(r.id)}"><b>${esc(r.nume)}</b></button><span class="muted">${esc(teamName(respOf(r)) || 'nealocat')}</span></li>`).join('')}</ol>` : '<div class="empty"><b>Niciun client în lucru nu stă pe loc</b></div>'}</div>
    </section>`;
}

let suggIdx = -1;

  const box = $('#sugg'); const toks = qTokens();

  const all = C.filter(r => passQ(r, toks));
  const res = all.slice().sort((a, b) => (toks.every(t => b._name.includes(t)) - toks.every(t => a._name.includes(t))) || (b.status === 'tinta') - (a.status === 'tinta') || a._ord - b._ord).slice(0, 7);
  suggIdx = -1;
  box.innerHTML = (res.length ? res.map((r, i) => `<button data-open="${esc(r.id)}" data-si="${i}">${avatar(respOf(r), teamName(respOf(r)))}<span class="t"><b>${esc(r.nume)}</b><small>${esc(r.sector || STATUS_N[r.status])} · ${r.judete.map(j => JUD[j]).slice(0, 3).join(', ') || '—'}${r.cui ? ' · CUI ' + esc(r.cui) : ''}</small></span>${r.status === 'tinta' ? stageTag(etapaOf(r)) : `<span class="flag f-gray">${esc(STATUS_N[r.status])}</span>`}</button>`).join('')

    (all.length ? `<button class="all" data-act="allres">${ico('search')}Arată toate cele ${all.length} rezultate în listă</button>` : '');

}
function hideSugg() { const b = $('#sugg'); if (b) { b.hidden = true; b.innerHTML = ''; } }
function moveSugg(d) {
  const items = [...document.querySelectorAll('#sugg [data-si]')]; if (!items.length) return;
  suggIdx = (suggIdx + d + items.length) % items.length;
  items.forEach((b, i) => b.classList.toggle('hl', i === suggIdx));

async function exportCSV() {

  const H = ['Nr', 'Lista', 'Status', 'Client', 'Denumire completă', 'CUI', 'Responsabil', 'Etapă', 'Următorul pas', 'Termen', 'Ultima activitate', 'Județe', 'Regiuni', 'Oltenia', 'Flux HU',
    'Regim temperatură', 'Tip marfă', 'Curse/an min', 'Curse/an max', 'Potențial', 'Risc', 'Red flag', 'Clasă', 'CA 2025 (RON)', 'Prima cursă', 'Vehicul', 'Ruta din fișier', 'Notițe echipa operațională', 'E-mail public', 'Telefon public'];
  const cell = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [H.join(';')].concat(rows.map(r => { const p = P(r); return [r.nr, ({ ioan: 'Ioan', val2: 'Val 2' }[r.sursa] || 'Domestic'), STATUS_N[r.status], r.nume, r.titlu, r.cui, teamName(respOf(r)), ETAPA_N[etapaOf(r)], p.pas, fmtDate(p.termen), fmtDate(D.last[r.id]),
    r.judete.join(', '), r.regiuni.join(', '), r.oltenia ? 'da' : '', r.hu ? 'da' : '', (r.temp || []).join(', '), r.sector, r.vol_min, r.vol_max, r.pot_max ? r.pot_min + '–' + r.pot_max : '', RISC_N[r.risc], r.red_flag, r.clasa,
    r.ca2025 == null ? '' : Math.round(r.ca2025), fmtDate(r.prima_cursa), (r.vehicul_istoric || []).join(', '), r.ruta_istorica, r.nota_fisier, (r.emails || []).join(', '), (r.telefoane || []).join(', ')].map(cell).join(';'); }));
  try { await D.dl.save({ filename: `crm-reactivare-${TODAY}.csv`, data: '﻿' + lines.join('\r\n') }); toast('Fișierul a fost descărcat.'); }

}

  const t = e.target.closest('button, [data-open], [data-jud], [role="button"]');

  }
  if (f.id === 'motivform') { const k = f.dataset.k; await changeStage(S.open, k, $('#m-text').value.trim()); return; }
  if (f.id === 'jform') {
    const text = $('#j-text').value.trim(), err = $('#j-err');
    if (!text) { err.textContent = 'Scrie ce s-a întâmplat înainte să adaugi nota.'; $('#j-text').focus(); return; }
    err.textContent = '';
    const tip = (f.querySelector('.tip[aria-pressed="true"]') || {}).dataset?.tip || 'nota';
    const btn = f.querySelector('button.pri'); btn.disabled = true;
    const ok = await write(() => D.db.collection('observatii').add({ cid: f.dataset.id, autor: D.uid || null, data: new Date().toISOString(), tip, text }));
    btn.disabled = false; if (ok) { $('#j-text').value = ''; toast('Nota a fost adăugată în jurnal.'); } return;
  }
  if (f.id === 'cform') {
    const c = { nume: $('#c-nume').value.trim(), rol: $('#c-rol').value.trim(), tel: $('#c-tel').value.trim(), email: $('#c-email').value.trim() };
    const err = $('#c-err');
    if (!c.nume && !c.tel && !c.email) { err.textContent = 'Completează cel puțin un nume, un telefon sau un e-mail.'; return; }
    if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) { err.textContent = 'Adresa de e-mail nu pare validă.'; return; }
    err.textContent = '';
    const ok = await write(() => D.db.collection('contacte').add(Object.assign({ cid: f.dataset.id, autor: D.uid || null, data: new Date().toISOString() }, c)));
    if (ok) { ['#c-nume', '#c-rol', '#c-tel', '#c-email'].forEach(s => { $(s).value = ''; }); toast('Contactul a fost adăugat.'); } return;
  }
  if (f.id === 'addmember') {
    const n = $('#am-name').value.trim(), err = $('#am-err');
    if (!n) { err.textContent = 'Scrie numele colegului.'; return; }
    const k = fold(n).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
    if (!k) { err.textContent = 'Numele trebuie să conțină litere.'; return; }
    const membri = team(); if (membri.some(x => x.k === k)) { err.textContent = 'Colegul e deja în listă.'; return; }
    membri.push({ k, n }); const ok = await write(() => D.db.doc('config/echipa').set({ membri })); if (ok) toast(n + ' a fost adăugat în echipă.');
  }
});
document.addEventListener('dragstart', e => { const k = e.target.closest && e.target.closest('[data-drag]'); if (k) { e.dataTransfer.setData('text/plain', k.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (!c) return; e.preventDefault(); c.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (!id || !BYID.has(id)) return; changeStage(id, c.dataset.drop); });

/* ---------- pornire ---------- */

boot();
})();
